<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Perfil público de mascota registrada en el Padrón Municipal REMAC de El Grullo, Jalisco." />
  <title>Mascota REMAC — El Grullo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fff7ed 0%, #fff3e0 50%, #fde8c8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(242,122,0,.18), 0 4px 16px rgba(0,0,0,.08);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
      animation: slideUp .45s cubic-bezier(.34,1.56,.64,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(32px) scale(.96); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* ── Header ── */
    .card-header {
      background: linear-gradient(135deg, #F27A00 0%, #FF9A2E 100%);
      padding: 28px 28px 20px;
      text-align: center;
      position: relative;
    }
    .card-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 99px;
      padding: 4px 14px;
      font-size: .72rem;
      font-weight: 700;
      color: white;
      letter-spacing: .04em;
      margin-bottom: 16px;
    }
    .card-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid white;
      background: rgba(255,255,255,.25);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-avatar .icon-line { width: 48px; height: 48px; color: white; }
    .card-pet-name {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: white;
      letter-spacing: -.02em;
    }
    .card-pet-sub {
      font-size: .9rem;
      color: rgba(255,255,255,.85);
      margin-top: 4px;
    }

    /* ── Body ── */
    .card-body { padding: 24px 28px; }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .info-row:last-child { border-bottom: none; }
    .info-icon {
      width: 38px;
      height: 38px;
      background: #FFF3E6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .info-content {}
    .icon-line { width: 1.1rem; height: 1.1rem; stroke: currentColor; display: inline-block; vertical-align: -0.15em; }
    .info-label {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #B0B0B0;
      margin-bottom: 2px;
    }
    .info-value {
      font-size: .95rem;
      font-weight: 600;
      color: #1A1A1A;
      line-height: 1.3;
    }
    .info-value.mono {
      font-family: monospace;
      font-size: .88rem;
      color: #C96200;
    }

    /* ── Call button ── */
    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #F27A00, #FF9A2E);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-top: 20px;
      transition: all .25s ease;
      box-shadow: 0 4px 16px rgba(242,122,0,.35);
    }
    .call-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(242,122,0,.45); }
    .call-btn:active { transform: translateY(0); }

    .sms-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px;
      background: white;
      color: #1A1A1A;
      border: 1.5px solid #E0E0E0;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 10px;
      transition: all .25s ease;
    }
    .sms-btn:hover { border-color: #F27A00; color: #F27A00; }

    /* ── Footer ── */
    .card-footer {
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      padding: 16px 28px;
      text-align: center;
    }
    .card-footer-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #B0B0B0;
      font-size: .78rem;
    }
    .card-footer-logo strong { color: #F27A00; }

    /* ── Estatus badge ── */
    .estatus-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: .72rem;
      font-weight: 700;
    }
    .pill-alta { background: #E8F5E9; color: #2E7D32; }
    .pill-baja { background: #F5F5F5; color: #9E9E9E; }

    /* ── Not found ── */
    .not-found {
      text-align: center;
      padding: 40px 28px;
    }
    .not-found-icon { font-size: 3.5rem; margin-bottom: 16px; }
    .not-found h2 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; color: #1A1A1A; margin-bottom: 8px; }
    .not-found p  { font-size: .88rem; color: #7A7A7A; }
  </style>
</head>
<body>

<div class="card" id="pet-card">
  <!-- JS will render content here -->
  <div class="not-found">
    <div class="not-found-icon"><svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:2.2rem;height:2.2rem;"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg></div>
    <h2>Cargando...</h2>
    <p>Buscando información de la mascota.</p>
  </div>
</div>

<script src="js/api-client.js"></script>
<script>
// ── Read ID from URL params ──
const params = new URLSearchParams(window.location.search);
const petId  = params.get('id') || params.get('folio');

const ICON_DOG = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.25 16.25h1.5L12 17z" /><path d="M16 14v.5" /><path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" /><path d="M8 14v.5" /><path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" /></svg>';
const ICON_CAT = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z" /><path d="M8 14v.5" /><path d="M16 14v.5" /><path d="M11.25 16.25h1.5L12 17l-.75-.75Z" /></svg>';
const ICON_ID = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10h2" /><path d="M16 14h2" /><path d="M6.17 15a3 3 0 0 1 5.66 0" /><circle cx="9" cy="11" r="2" /><rect x="2" y="5" width="20" height="14" rx="2" /></svg>';
const ICON_VENUS = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v7" /><path d="M9 19h6" /><circle cx="12" cy="9" r="6" /></svg>';
const ICON_MARS = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5" /><path d="m21 3-6.75 6.75" /><circle cx="10" cy="14" r="6" /></svg>';
const ICON_PALETTE = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /><circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /><circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /><circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /><circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg>';
const ICON_SEARCH = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>';
const ICON_USER = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>';
const ICON_PHONE = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384" /></svg>';
const ICON_PIN = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg>';
const ICON_MSG = '<svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>';

function renderPet(pet) {
  const estaEspecie = pet.especie === 'gato' ? ICON_CAT : ICON_DOG;
  const estatusPill = pet.estatus === 'Alta'
    ? '<span class="estatus-pill pill-alta">● Alta</span>'
    : '<span class="estatus-pill pill-baja">● Baja</span>';

  const avatarContent = pet.foto_url && pet.foto_url.length > 10
    ? `<img src="${pet.foto_url}" alt="${pet.nombre}" />`
    : estaEspecie;

  const telefono = pet.telefono || '';
  const telefonoLimpio = telefono.replace(/\D/g, '');

  document.getElementById('pet-card').innerHTML = `
    <div class="card-header">
      <div class="card-header-badge">
        <img src="Imagenes/Distintivo HAyto El Grullo CB.png" alt="El Grullo" style="height:18px; width:auto; vertical-align:middle;" />
        Padrón Municipal REMAC · El Grullo
      </div>
      <div class="card-avatar">${avatarContent}</div>
      <div class="card-pet-name">${pet.nombre}</div>
      <div class="card-pet-sub">${pet.especie.charAt(0).toUpperCase() + pet.especie.slice(1)}${pet.raza ? ' · ' + pet.raza : ''} &nbsp; ${estatusPill}</div>
    </div>

    <div class="card-body">

      <div class="info-row">
        <div class="info-icon">${ICON_ID}</div>
        <div class="info-content">
          <div class="info-label">Folio REMAC</div>
          <div class="info-value mono">${pet.id}</div>
        </div>
      </div>

      ${pet.sexo ? `
      <div class="info-row">
        <div class="info-icon">${pet.sexo === 'hembra' ? ICON_VENUS : ICON_MARS}</div>
        <div class="info-content">
          <div class="info-label">Sexo · Edad</div>
          <div class="info-value">${pet.sexo.charAt(0).toUpperCase() + pet.sexo.slice(1)}${pet.edad_label ? ' · ' + pet.edad_label : ''}</div>
        </div>
      </div>` : ''}

      ${pet.color ? `
      <div class="info-row">
        <div class="info-icon">${ICON_PALETTE}</div>
        <div class="info-content">
          <div class="info-label">Color</div>
          <div class="info-value">${pet.color}</div>
        </div>
      </div>` : ''}

      ${pet.senias_particulares ? `
      <div class="info-row">
        <div class="info-icon">${ICON_SEARCH}</div>
        <div class="info-content">
          <div class="info-label">Señas particulares</div>
          <div class="info-value">${pet.senias_particulares}</div>
        </div>
      </div>` : ''}

      <div class="info-row">
        <div class="info-icon">${ICON_USER}</div>
        <div class="info-content">
          <div class="info-label">Dueño / Responsable</div>
          <div class="info-value">${pet.persona || '—'}</div>
        </div>
      </div>

      ${telefono ? `
      <div class="info-row">
        <div class="info-icon">${ICON_PHONE}</div>
        <div class="info-content">
          <div class="info-label">Número de contacto</div>
          <div class="info-value">${telefono}</div>
        </div>
      </div>` : ''}

      ${pet.colonia ? `
      <div class="info-row">
        <div class="info-icon">${ICON_PIN}</div>
        <div class="info-content">
          <div class="info-label">Colonia</div>
          <div class="info-value">${pet.colonia}${pet.direccion ? ' · ' + pet.direccion : ''}</div>
        </div>
      </div>` : ''}

      ${telefono ? `
        <a class="call-btn" href="tel:${telefonoLimpio}">
          ${ICON_PHONE} Llamar al dueño
        </a>
        <a class="sms-btn" href="sms:${telefonoLimpio}">
          ${ICON_MSG} Enviar mensaje
        </a>
      ` : ''}
    </div>

    <div class="card-footer">
      <div class="card-footer-logo" style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <img src="Imagenes/Distintivo HAyto El Grullo CB.png" alt="H. Ayuntamiento" style="height:22px; width:auto;" />
        Registrado en <strong>REMAC</strong> — H. Ayuntamiento de El Grullo, Jal.
      </div>
    </div>
  `;
}

function renderNotFound(id) {
  document.getElementById('pet-card').innerHTML = `
    <div class="not-found">
      <div class="not-found-icon"><svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:2.2rem;height:2.2rem;"><path d="m13.5 8.5-5 5" /><path d="m8.5 8.5 5 5" /><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg></div>
      <h2>Mascota no encontrada</h2>
      <p>No se encontró ninguna mascota con el folio <strong>${id || '—'}</strong> en el padrón REMAC.</p>
      <p style="margin-top:12px; font-size:.8rem;">Si crees que es un error, contacta al Ayuntamiento.</p>
    </div>
    <div class="card-footer">
      <div class="card-footer-logo" style="display:flex; align-items:center; justify-content:center; gap:8px;">
        <img src="Imagenes/Distintivo HAyto El Grullo CB.png" alt="H. Ayuntamiento" style="height:22px; width:auto;" />
        <strong>REMAC</strong> — H. Ayuntamiento de El Grullo, Jal.
      </div>
    </div>
  `;
}

// ── Find pet (endpoint público, sin sesión) ──
async function findPet(id) {
  if (!id) return null;
  try {
    return await apiGetMascota(id);
  } catch (e) {
    return null;
  }
}

(async () => {
  const pet = await findPet(petId);
  if (pet) {
    renderPet(pet);
    document.title = `${pet.nombre} — REMAC · El Grullo`;
  } else {
    renderNotFound(petId);
  }
})();
</script>

</body>
</html>
